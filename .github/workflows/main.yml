name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # Фиксируем NDK r26d для Android (защита от багов NDK 29)
      - name: Set up NDK
        if: startsWith(matrix.config.target, 'Android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      # ВРЕМЕННЫЙ шаг: ищем, в каком классе объявлен pushButton
      - name: Find pushButton
        if: always() && startsWith(matrix.config.target, 'Android')
        run: |
          echo "=== SDK ==="
          grep -rn "pushButton" "$GEODE_SDK" --include=*.hpp || echo "no match in SDK"
          echo "=== bindings ==="
          grep -rn "pushButton" /home/runner/work/GD-bot/GD-bot/build --include=*.hpp || echo "no match in build"
          echo "=== cpm ==="
          grep -rln "pushButton" /home/runner/work/GD-bot/GD-bot/cpm-cache --include=*.hpp || echo "no match in cpm"

  package:
    name: Package Mod
    needs: ['build']
    runs-on: ubuntu-latest

    steps:
      # Упаковывает Windows (.dll), Android32 (.so) и Android64 (.so) в один файл .geode
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: CBF-TAS-Bot-Universal
          path: ${{ steps.build.outputs.build-output }}
